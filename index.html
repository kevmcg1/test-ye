<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dial Caliper Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/caliper.css">
</head>
<body>
<div class="app">
  <aside id="panel">
    <header class="logo">
      <h1 class="logo-mark" id="logoMark" aria-label="Dial caliper">
        <span class="logo-brk" aria-hidden="true">[</span>
        <span class="logo-stack" aria-hidden="true"><span class="logo-top" id="logoTop">Dial</span><span class="logo-bot">Caliper</span></span>
        <span class="logo-brk" aria-hidden="true">]</span>
      </h1>
      <div class="logo-rule" aria-hidden="true"></div>
      <div class="logo-foot"><span class="logo-range">0–6″ · .001″</span><button id="tutBtn">Tutorial</button></div>
    </header>

    <section>
      <h2>Slider</h2>
      <input type="range" id="slider" min="0" max="6300" step="1" aria-label="Jaw opening">
      <button class="tgl" id="fineBtn" aria-pressed="false" data-tip="Fine adjust&#10;Slows the slider, thumb wheel, bezel and arrow keys down about 10× for hairline moves."><i class="fa-solid fa-feather-pointed"></i><span>Fine adjust</span><em>off</em></button>
      <p class="note fine-note" id="fineWin"></p>
      <div class="units" role="group" aria-label="Units"><button type="button" data-units="in" aria-pressed="true">Inches</button><button type="button" data-units="mm" aria-pressed="false">Millimeters</button></div>
      <div class="grid3">
        <button data-step="-0.1">−.100</button>
        <button data-step="-0.01">−.010</button>
        <button data-step="-0.001">−.001</button>
        <button data-step="0.1">+.100</button>
        <button data-step="0.01">+.010</button>
        <button data-step="0.001">+.001</button>
      </div>
      <div class="row">
        <button id="closeBtn">Close jaws</button>
        <button id="openBtn">Open fully</button>
      </div>
      <div class="row">
        <button id="lockBtn" aria-pressed="false">Lock slider</button>
        <button id="bezelLockBtn" aria-pressed="false" data-inst="dial">Lock bezel</button>
      </div>
    </section>

    <section data-inst="dial">
      <h2>Dial bezel</h2>
      <div class="bezel-val"><span>Bezel offset</span><b id="bezelVal">0.000″</b></div>
      <input type="range" id="bezelRange" min="-50" max="50" step="1" value="0" aria-label="Bezel offset in thousandths">
      <div class="row">
        <button id="zeroBtn">Zero bezel</button>
        <button id="skewBtn">Random offset</button>
      </div>
      <button id="bezelResetBtn" class="bezel-reset" data-tip="Reset bezel&#10;Turns the bezel back to zero, even while it is locked."><i class="fa-solid fa-rotate-left"></i> Reset bezel</button>
      <p class="note" style="margin:8px 0 0">Close the jaws before measuring. If the needle isn't on 0, turn the bezel until it is, then lock it.</p>
    </section>

    <section class="sample-sec">
      <h2>Part</h2>
      <select id="sampleSel" aria-label="Part to measure">
        <option value="none">No part</option>
        <optgroup label="Outside jaws">
          <option value="pin">Gauge pin</option>
          <option value="hex">Hex bar</option>
          <option value="block">Gauge block</option>
          <option value="ball">Steel ball</option>
          <option value="tube">Aluminum tube</option>
        </optgroup>
        <optgroup label="Inside jaws">
          <option value="ring">Ring gauge</option>
          <option value="bearing">Ball bearing</option>
          <option value="slot">Slotted block</option>
          <option value="coupling">Brass coupling</option>
        </optgroup>
        <optgroup label="Depth rod">
          <option value="pocket">Pocket block</option>
          <option value="hole">Round boss</option>
          <option value="shoulder">Shouldered block</option>
          <option value="channel">Channel block</option>
        </optgroup>
      </select>
      <div class="row">
        <button id="newVals">New random size</button>
        <button id="revealBtn">Show actual</button>
      </div>
      <div id="feats"></div>
    </section>

    <section class="answer">
      <h2>Highlights</h2>
      <div class="hlcards">
        <label class="hlcard" style="--c:var(--hl-inch)"><input type="checkbox" data-hl="inch"><span><b>Inch number</b><small>Last whole inch the slider edge has passed</small></span></label>
        <label class="hlcard" style="--c:var(--hl-tenth)"><input type="checkbox" data-hl="tenth"><span><b>Tenth line</b><small data-inst="dial">Last 0.100″ line left of the slider edge</small><small data-inst="vern">Last beam digit (0.100″) left of the vernier zero</small></span></label>
        <label class="hlcard" style="--c:var(--hl-dial)" data-inst="dial"><input type="checkbox" data-hl="dial"><span><b>Dial reading</b><small>The dial mark under the needle, in thousandths</small></span></label>
        <label class="hlcard" style="--c:var(--hl-sub)" data-inst="vern"><input type="checkbox" data-hl="sub"><span><b>0.025″ lines</b><small>Short beam lines passed after that digit</small></span></label>
        <label class="hlcard" style="--c:var(--hl-vern)" data-inst="vern"><input type="checkbox" data-hl="vern"><span><b>Vernier line</b><small>The vernier line that meets a beam line, in thousandths</small></span></label>
        <label class="hlcard" style="--c:#c9ced4"><input type="checkbox" data-hl="outline"><span><b>Part outline</b><small>Colored outline around the part being measured</small></span></label>
      </div>
    </section>

    <section>
      <h2>Graphics</h2>
      <select id="gfxSel" aria-label="Graphics quality">
        <option value="high" selected>High</option>
        <option value="medium">Balanced</option>
        <option value="low">Low</option>
      </select>
      <p class="note" id="gfxInfo" style="margin:8px 0 0">Resolution adapts automatically to hold 60 fps.</p>
      <label class="chk" style="margin:12px 0 0"><input type="checkbox" id="realChk"> Realistic metal finish</label>
      <p class="note" style="margin:6px 0 0">Adds real turning and grinding marks. Off keeps the markings clear and easy to read.</p>
    </section>

    <section class="help">
      <h2>Reading the caliper</h2>
      <div data-inst="dial">
        <p><b>Beam numbers</b> are whole inches. Each <b>line</b> between them is 0.100″. Read the last line to the left of the slider edge.</p>
        <p><b>The dial</b> adds thousandths: each mark is 0.001″ and one full turn of the needle is 0.100″.</p>
        <p><b>Reading</b> = inches + tenths + dial. For example 1″ + 0.300″ + 0.047″ = 1.347″.</p>
        <p><b>Mouse:</b> drag the slider, dial or thumb wheel to move the jaws, scroll over the thumb wheel for 0.001″ steps, drag the knurled bezel to turn the dial face, and click a lock screw to lock it. Shift for fine control.</p>
      </div>
      <div data-inst="vern">
        <p><b>Beam numbers</b> are whole inches and the <b>small digits</b> are 0.100″. The <b>short lines</b> between digits are 0.025″ each. Read them all at the vernier's 0 line.</p>
        <p><b>The vernier</b> adds thousandths: find the one vernier line that meets a beam line exactly. Its number is the thousandths, 0 to 24.</p>
        <p><b>Reading</b> = inches + tenths + 0.025″ lines + vernier. For example 1″ + 0.300″ + 0.050″ + 0.012″ = 1.362″.</p>
        <p><b>Mouse:</b> drag the slider or thumb wheel to move the jaws, scroll over the thumb wheel for 0.001″ steps, and click the lock screw to lock it. Shift for fine control.</p>
      </div>
      <p><b>Fine adjust</b> slows every control down about 10×: the slider covers a 0.100″ window, and the wheel steps 0.0001″, so it takes several steps to move the needle to the next mark.</p>
      <p><b>Keys:</b> ←→ 0.001″ (0.0001″ in fine adjust), Shift+←→ 0.010″, PgUp/PgDn 0.100″, F fine adjust, L lock slider, <span data-inst="dial">B lock bezel, Z zero bezel, </span>A auto measure, Esc dismiss.</p>
    </section>
  </aside>

  <main>
    <div id="view">
      <div class="loading" id="loading"><div class="ld"><span class="ld-t" id="ldT">Loading the 3D engine…</span><div class="ld-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="ldFill"></i></div><span class="ld-p" id="ldP">0%</span></div></div>
      <script src="js/loading.js"><\/script>
      <div class="actions">
        <button class="ib" id="sideBtn" aria-pressed="false" aria-label="Hide the side panel" data-tip="Hide the side panel&#10;Gives the 3D view the whole width."><i class="fa-solid fa-angles-left ic-off"></i><i class="fa-solid fa-angles-right ic-on"></i></button>
        <button class="ib" id="autoBtn" aria-label="Auto measure" data-tip="Auto measure&#10;Opens the jaws, then closes them gently on the part."><i class="fa-solid fa-wand-magic-sparkles"></i></button>
        <button class="pbtn" id="examBtn" data-tip="Examination&#10;Cinematic tour with labels on every part. Rotate, pan and zoom freely."><i class="fa-solid fa-binoculars"></i><span>Examine</span></button>
        <button class="pbtn" id="practiceBtn" aria-pressed="false" data-tip="Practice reading&#10;Hides the answers, picks a random part and size, and puts an answer box in the reading bar."><i class="fa-solid fa-graduation-cap"></i><span>Practice</span></button>
        <button class="ib" id="pullBtn" aria-label="Remove part" data-tip="Remove part&#10;Takes the part off the caliper."><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
      <div class="views" role="group" aria-label="Camera views">
        <button class="ib" data-view="iso" aria-label="Iso view" data-tip="Iso view&#10;Angled overview of the whole caliper."><i class="fa-solid fa-cube"></i></button>
        <button class="ib" data-view="front" aria-label="Front view" data-tip="Front view&#10;Straight-on view of the caliper."><i class="fa-solid fa-vector-square"></i></button>
        <button class="ib" data-view="scale" aria-label="Scale view" data-tip="Scale view&#10;Close-up of the beam scale at the slider edge."><i class="fa-solid fa-ruler-horizontal"></i></button>
        <button class="ib" data-view="dial" id="fineViewBtn" aria-label="Dial view" data-tip="Dial view&#10;Close-up of the dial and needle."><span class="ic-dial"><i class="fa-solid fa-gauge"></i></span><span class="ic-vern"><i class="fa-solid fa-ruler-combined"></i></span></button>
        <button class="ib" data-view="jaws" aria-label="Jaws view" data-tip="Jaws view&#10;Close-up of the jaws or depth rod on the part."><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      </div>
      <div class="xlayer" id="xlayer" aria-hidden="true"><svg id="xsvg"></svg></div>
      <div class="cine top"><span class="ct">Examination</span><div class="cc">
        <button class="pbtn" id="spinBtn" aria-pressed="true" aria-label="Auto-rotate"><i class="fa-solid fa-rotate"></i><span>Auto-rotate</span></button>
        <button class="pbtn" id="labelsBtn" aria-pressed="true" aria-label="Labels"><i class="fa-solid fa-tags"></i><span>Labels</span></button>
        <button class="pbtn" id="exitExam" aria-label="Exit examination"><i class="fa-solid fa-xmark"></i><span>Exit</span></button></div></div>
      <div class="cine bot"><span class="hint"><span class="m-only">Left-drag to rotate · right-drag to pan · scroll to zoom</span><span class="t-only">Drag to rotate · two fingers to pan · pinch to zoom</span> · Esc to exit</span></div>
      <div class="coach" aria-hidden="true"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="legend" aria-label="Mouse controls">

        <span class="mk"><span class="mouse r" aria-hidden="true"><i class="fa-solid fa-computer-mouse"></i><b></b></span>Pan</span>
        <span class="mk"><span class="mouse m" aria-hidden="true"><i class="fa-solid fa-computer-mouse"></i><b></b></span>Zoom</span>
      </div>
      <div class="quick" role="group" aria-label="Slider controls">
        <div class="hlbar" role="group" aria-label="Highlight colors"></div>
        <button class="ib" id="panelBtn" aria-pressed="false" aria-label="Hide the reading panel" data-tip="Hide the reading panel&#10;Gives the 3D view the whole height."><i class="fa-solid fa-angles-down ic-off"></i><i class="fa-solid fa-angles-up ic-on"></i></button>
        <button class="ib" id="closeQuick" aria-label="Close jaws" data-tip="Close jaws&#10;Closes the jaws, or until they touch the part."><i class="fa-solid fa-down-left-and-up-right-to-center"></i></button>
        <button class="ib" id="openQuick" aria-label="Open fully" data-tip="Open fully&#10;Opens the jaws as far as they go."><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
        <button class="ib" id="lockQuick" aria-label="Lock slider" aria-pressed="false" data-tip="Lock slider&#10;Tightens the lock screw so the slider can’t move."><i class="fa-solid fa-lock-open ic-off"></i><i class="fa-solid fa-lock ic-on"></i></button>
        <div class="goto" role="group" aria-label="Go to a reading"><input type="text" id="setTo" placeholder="Go to 1.234 in" inputmode="decimal" aria-label="Move slider to reading"><button class="ib" id="goBtn" aria-label="Go to that reading">Go</button></div>
        <button class="ib" id="fineQuick" aria-label="Fine adjust" aria-pressed="false" data-tip="Fine adjust&#10;Slows the slider, thumb wheel, bezel and arrow keys down about 10× for hairline moves."><i class="fa-solid fa-feather-pointed"></i></button>
      </div>
      <div class="flat" id="flat">

        <span class="op answer" data-inst="dial">+</span>
        <div class="cell answer" data-c="dial" data-inst="dial"><span class="k">Dial</span><span class="v" id="vC"></span><span class="h" id="hC"></span></div>

<div class="tut" id="tut" role="dialog" aria-modal="true" aria-labelledby="tutTitle" hidden>
  <div class="tut-card">
    <h3 id="tutTitle">Welcome to the caliper!</h3>
    <p data-inst="dial">This handy tool measures almost anything up to 6 inches: outsides, insides and depths. Never held one? Perfect. You’ll be reading it in a few minutes.</p>
    <p data-inst="vern">No dial, no batteries, just two scales that line up. It reads inches along the bottom and millimeters along the top, and it’s easier than it looks.</p>
    <p class="tut-mouse"><b>New to the mouse?</b> <b>Click</b> = press the left button once. <b>Drag</b> = hold it down, move, then let go. That’s all you need.</p>
    <ol>
      <li><b>Pick a part.</b> Choose one from “Part” on the left, then click the magic wand. The jaws close gently on it for you.</li>
      <li data-inst="dial"><b>Read it.</b> The last big number you passed + the small lines after it (0.100″ each) + where the needle points (0.001″ each).</li>
      <li data-inst="dial"><b>Needle not on 0 when closed?</b> Click “Reset bezel” on the left. It turns the dial back to zero, even when it’s locked.</li>
      <li data-inst="vern"><b>Inches or metric?</b> Use the Inches / Metric toggle right above the flat view, or the one on the left. The colors and the flat view follow along.</li>
      <li data-inst="vern"><b>Read inches (bottom).</b> Big number + small numbers after it (0.100″) + tiny lines after those (0.025″) + the sliding line that lines up perfectly (0.001″).</li>
      <li data-inst="vern"><b>Read millimeters (top).</b> The last whole millimeter before the top sliding 0, plus the top line that lines up perfectly (0.05 mm each).</li>
      <li><b>Turn on the colors.</b> The colored dots at the bottom left start off. Tap one and its piece of the reading lights up on the tool. Tap it again to hide it.</li>
      <li><b>Jump to a size.</b> Type into the “Go to” box at the bottom left and press Go. Add “in” or “mm” (like “25.4 mm” or “1.5 in”) and it knows which you mean.</li>
      <li><b>Zoom the flat view.</b> The box in the corner shows the scales flat. The expand button makes it full height; the eye hides it.</li>
      <li><b>Clear or real?</b> Markings start on plain, easy-to-read metal. The gem button at the top right brings back the real machined finish.</li>
      <li data-inst="dial"><b>Practice.</b> Click “Practice,” type what you read, then “Check.” Slip up? No stress. It shows exactly which step went wrong, and why.</li>
      <li data-inst="vern"><b>Practice in either unit.</b> Click “Practice,” pick Inches or Metric, type what you read, then “Check.” It walks you through any step that slipped.</li>
    </ol>
    <div class="row"><button class="primary" id="tutClose">Let’s measure!</button></div>
  </div>
</div>

    <section>
      <h2>Frame size</h2>

  <div class="tut-card">
    <h3 id="tutTitle">Welcome to the micrometer!</h3>
    <p>This one measures thickness to a ten-thousandth of an inch, far thinner than a hair. It’s really just careful counting, and we’ll do it together.</p>
    <p class="tut-mouse"><b>New to the mouse?</b> <b>Click</b> = press the left button once. <b>Drag</b> = hold it down, move, then let go. That’s all you need.</p>
    <ol>
      <li><b>Pick a size and a part.</b> Choose a frame size on the left (its first number starts every reading), then a part, then click a feature to measure it.</li>
      <li><b>Read it.</b> Frame size + the last sleeve number (0.100″) + small lines after it (0.025″) + the thimble line at the center line (0.001″) + the top line that lines up perfectly (0.0001″).</li>
      <li><b>Turn on the colors.</b> The colored dots at the bottom left start off. Tap one and its piece of the reading lights up on the tool. Tap it again to hide it.</li>
      <li><b>Jump to a size.</b> Type into the “Go to” box at the bottom left and press Go. Add “in” or “mm” (like “0.6254 in” or “15.9 mm”) and it knows which you mean.</li>
      <li><b>Zoom the flat view.</b> The box in the corner shows the scales flat. The expand button makes it full height; the eye hides it.</li>
      <li><b>Clear or real?</b> Markings start on plain, easy-to-read metal. The gem button at the top right brings back the real machined finish.</li>
      <li><b>Practice.</b> Click “Practice,” type what you read, then “Check.” Slip up? No stress. It shows exactly which step went wrong, and why.</li>
    </ol>
    <div class="row"><button class="primary" id="tutClose">Let’s measure!</button></div>
  </div>

<div class="tut" id="tut" role="dialog" aria-modal="true" aria-labelledby="tutTitle" hidden>
  <div class="tut-card">
    <h3 id="tutTitle">Welcome to the depth micrometer!</h3>
    <p>This one measures how deep things are. One twist to remember: read the numbers the thimble has <i>covered</i>, not the ones you can still see. Everyone trips on it at first!</p>
    <p class="tut-mouse"><b>New to the mouse?</b> <b>Click</b> = press the left button once. <b>Drag</b> = hold it down, move, then let go. That’s all you need.</p>
    <ol>
      <li><b>Pick a rod and a part.</b> Choose a rod on the left (its first number is added to the reading), then a part, then click a feature to measure it.</li>
      <li><b>Read it.</b> Rod size + the last number covered (0.100″) + the small lines covered after it (0.025″) + the thimble line at the center line (0.001″).</li>
      <li><b>See where it’s measuring.</b> The green dot at the bottom left tints the face the rod is touching. Turn it off for a plain part.</li>
      <li><b>Turn on the colors.</b> The colored dots at the bottom left start off. Tap one and its piece of the reading lights up on the tool. Tap it again to hide it.</li>
      <li><b>Jump to a size.</b> Type into the “Go to” box at the bottom left and press Go. Add “in” or “mm” (like “0.625 in” or “12 mm”) and it knows which you mean.</li>
      <li><b>Zoom the flat view.</b> The box in the corner shows the scales flat. The expand button makes it full height; the eye hides it.</li>
      <li><b>Clear or real?</b> Markings start on plain, easy-to-read metal. The gem button at the top right brings back the real machined finish.</li>
      <li><b>Practice.</b> Click “Practice,” type what you read, then “Check.” Slip up? No stress. It shows exactly which step went wrong, and why.</li>
    </ol>
    <div class="row"><button class="primary" id="tutClose">Let’s measure!</button></div>
  </div>
</div>

    <section class="help">
      <h2>Reading a vernier height gage</h2>
      <p><b>Inch (left):</b> the main scale is in 0.050″ steps. Take the last line below the vernier 0, then add the vernier line that lines up exactly with a main-scale line — each one is 0.001″.</p>
      <p><b>Metric (right):</b> whole millimeters from the main scale, plus the lined-up vernier line × 0.02 mm. The vernier's big numbers are tenths of a millimeter.</p>
      <p><b>Mouse:</b> drag the part to slide it around the plate (the scriber lifts to 0.100″ above its tallest point; the face it will land on turns green, and holding still for a moment or letting go measures it), drag the slider or scriber to move it, drag or scroll the fine-feed nut, click a clamp knob to lock it, turn the knob at the top of the beam to shift the main scale.</p>

        <div class="cell" style="--c:var(--hl-main)"><span class="k">Main scale</span><span class="v" id="iMain"></span><span class="h" id="iMainH"></span></div>
        <span class="op">+</span>
        <div class="cell" style="--c:var(--hl-vern)"><span class="k">Vernier</span><span class="v" id="iVern"></span><span class="h" id="iVernH"></span></div>
        <span class="op">=</span>
        <div class="cell total"><span class="k">Reading</span><span class="v" id="iTot"></span><span class="h">inches</span></div>
      </div>
      <div class="rgroup answer">
        <span class="rtitle">Metric</span>
        <div class="cell" style="--c:var(--hl-mmain)"><span class="k">Main scale</span><span class="v" id="mMain"></span><span class="h" id="mMainH"></span></div>
        <span class="op">+</span>
        <div class="cell" style="--c:var(--hl-mvern)"><span class="k">Vernier</span><span class="v" id="mVern"></span><span class="h" id="mVernH"></span></div>
        <span class="op">=</span>
        <div class="cell total"><span class="k">Reading</span><span class="v" id="mTot"></span><span class="h">millimeters</span></div>
      </div>
      <div class="rstat">
        <span class="status-chip" id="status">Slider free</span>
        <span class="status-chip" id="contact">Scriber in the air</span>
      </div>
      <div class="pract">
        <select id="pUnit" aria-label="Answer units"><option value="in">Inch</option><option value="mm">Metric</option></select>
        <input type="text" id="guess" inputmode="decimal" autocomplete="off" placeholder="0.000" aria-label="Your reading">
        <button class="primary" id="checkBtn">Check</button>
        <button id="nextBtn">Next</button>
        <div id="pfb" aria-live="polite"><p class="pintro">Read the gage and type the height.</p></div>
      </div>
    </section>
  </main>
</div>

<div class="tut" id="tut" role="dialog" aria-modal="true" aria-labelledby="tutTitle" hidden>
  <div class="tut-card">
    <h3 id="tutTitle">Welcome to the height gage!</h3>
    <p>The height gage measures how tall things are, up to 12 inches (300 mm). The granite table is your zero, and the rest is reading two scales.</p>
    <p class="tut-mouse"><b>New to the mouse?</b> <b>Click</b> = press the left button once. <b>Drag</b> = hold it down, move, then let go. That’s all you need.</p>
    <ol>
      <li><b>Pick a part.</b> Choose one from “Part” on the left, then click a step. The tip lowers onto it for you.</li>
      <li><b>Read it.</b> The last line on the tall scale below the sliding scale’s 0, plus the sliding line that lines up perfectly. Inches are on the left, millimeters on the right.</li>
      <li><b>Check the close-up.</b> The strip above the flat view magnifies the two lines that meet, inch and metric, so you can double-check yourself.</li>
      <li><b>See where it’s measuring.</b> The green dot at the bottom left tints the face the tip is on. Turn it off for a plain part.</li>
      <li><b>Turn on the colors.</b> The colored dots at the bottom left start off. Tap one and its piece of the reading lights up on the tool. Tap it again to hide it.</li>
      <li><b>Jump to a size.</b> Type into the “Go to” box at the bottom left and press Go. Add “in” or “mm” (like “3.742 in” or “95 mm”) and it knows which you mean.</li>
      <li><b>Zoom the flat view.</b> The box in the corner shows the scales flat. The expand button makes it full height; the eye hides it.</li>
      <li><b>Clear or real?</b> Markings start on plain, easy-to-read metal. The gem button at the top right brings back the real machined finish.</li>
      <li><b>Practice.</b> Click “Practice,” type what you read, then “Check.” Slip up? No stress. It shows exactly which step went wrong, and why.</li>
    </ol>
    <div class="row"><button class="primary" id="tutClose">Let’s measure!</button></div>
  </div>
</div>
